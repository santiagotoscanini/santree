title: Santree
description: A beautiful CLI for managing Git worktrees, with integrated AI assistance — Linear / GitHub Issues, tmux / cmux, and Claude in the loop.

# Custom domain — docs live at the root, not under /santree.
# CNAME file in docs/ binds the GitHub Pages deploy to this domain.
url: https://santree.toscanini.me
baseurl: ""

# Just the Docs — remote theme works in Pages' safe mode (no Gemfile needed).
remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: dark

# Sidebar logo. Path is relative to site root; baseurl is added automatically.
logo: "/assets/icon.png"

# Browser tab favicon.
favicon_ico: "/favicon.ico"

# Header aux links (top-right of every page)
aux_links:
  GitHub: https://github.com/santiagotoscanini/santree
  npm: https://www.npmjs.com/package/santree
aux_links_new_tab: true

# "Edit this page on GitHub" link in the footer of every page.
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/santiagotoscanini/santree
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

# Back-to-top floating link.
back_to_top: true
back_to_top_text: Back to top

# Copy button on every code block.
enable_copy_code_button: true

# Show "Last edited <date>" footer per page.
last_edit_timestamp: true
last_edit_time_format: "%b %-d, %Y"

# Search — preview snippets help users land on the right section, not just the right page.
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Mermaid diagrams render client-side via just-the-docs' built-in integration.
mermaid:
  version: "10.9.0"

# Anchor links + footer
heading_anchors: true
footer_content: 'Made with care · <a href="https://github.com/santiagotoscanini/santree">santree on GitHub</a> · MIT licensed'

# Don't ship the index source — Jekyll generates the rendered HTML.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Plugins kept minimal — all of these are on Pages' allow-list.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
